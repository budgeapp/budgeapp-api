name: Test with pytest

on:
  push:
    branches:
      - trunk
  pull_request:
    branches:
      - trunk

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql+asyncpg://${{vars.POSTGRES_USER}}:${{secrets.POSTGRES_PASSWORD}}@localhost:5432/${{vars.POSTGRES_USER}}

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ${{vars.POSTGRES_USER}}
          POSTGRES_PASSWORD: ${{secrets.POSTGRES_PASSWORD}}
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@d577e74f98a427f48a3593c77631249523bddd01
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version-file: pyproject.toml
      - run: uv sync --group test
      - run: uv run alembic upgrade head
      - run: uv run pytest
